# Feel: what a landing page can be. A story film told in beats (each a Z-Image still brought to life by LTX-2.3 on a
# local GPU), every sentence its own shot: laughter, pain, love, hate, longing. It ends on the showcase.
#   studio build examples/feel        (needs ComfyUI with Z-Image and LTX-2.3; about 5 minutes a beat on an RTX 4090)
name: Scroll Studio
description: A landing page is the door to a world. Scroll Studio makes the ones people feel.
theme:
  preset: night
  colors: { bg: "#070707", accent: "#ff7a3d", accent2: "#ffb27a" }
  fonts: { display: Fraunces, body: Inter, mono: JetBrains Mono }
  display_weight: 500
  display_italic_em: true
nav:
  cta: { label: The showcase, href: ../showcase/dist/index.html }
sections:
  - id: story
    type: film
    layout: overlay
    length: 26
    cue: Scroll
    beat_res: [1920, 1088]
    beats:
      - id: door
        seconds: 5
        seed: 17
        prompt: "Cinematic wide shot, perfectly centred symmetrical composition: a tall old wooden door in a simple frame standing alone on the crest of a vast desert dune at golden hour, the door is half open and through the doorway a glowing lush green valley with a waterfall and bright daylight is visible, a magical portal to another world, long shadows across rippled sand, dramatic towering clouds lit orange and pink, epic sense of scale, anamorphic lens, Roger Deakins cinematography, photoreal"
        motion: the camera slowly pushes in toward the open doorway, the waterfall in the valley beyond flows and glitters, warm light glows out of the doorway onto the sand, the clouds drift slowly, everything calm, no smoke, no dust
      - id: book
        seconds: 4
        prompt: An old open book lying on a wooden desk by a tall window, soft morning light, dust floating in the light beams, the pages slightly lifting at the edges, shallow depth of field, cinematic, photoreal
        motion: the pages flutter, tear free one by one and rise into the air, turning into a flock of white birds that fly up and out of the frame, the camera tilts up following them
      - id: laugh
        seconds: 4
        seed: 11
        prompt: A fluffy golden retriever puppy in a sunny backyard mid-pounce into a huge pile of orange autumn leaves, ears flopping, tongue out, joyful, warm afternoon light, shallow depth of field, photoreal
        motion: the puppy leaps into the leaf pile, tumbles over clumsily onto its back and pops up again with a leaf stuck on its head, tail wagging, leaves flying everywhere
      - id: hurt
        seconds: 5
        prompt: An elderly man sitting alone at a small kitchen table at night, rain streaking the window behind him, two teacups on the table, the one across from him untouched in front of an empty chair, a single warm lamp, quiet grief, cinematic, photoreal
        motion: he slowly reaches across the table and rests his hand beside the untouched teacup, then lowers his head, rain runs down the window, the camera stays almost still
      - id: love
        seconds: 5
        prompt: An elderly couple slow dancing barefoot in a warm living room at golden hour, foreheads touching, eyes closed, soft sunlight through sheer curtains, a record player in the background, tender, cinematic, photoreal
        motion: they sway slowly together and he gently turns her, she smiles with her eyes closed, the curtains drift in the breeze, the camera circles slowly around them
      - id: standoff
        seconds: 5
        seed: 19
        prompt: "Cinematic wide shot in pouring rain on a muddy medieval battlefield at dusk: two armoured knights in full steel plate armour stand facing each other in the centre, swords drawn, ten paces apart, behind each knight his army lined up in long ranks with banners and spears, one army in red surcoats on the left, the other in blue on the right, rain streaking through cold grey light, puddles reflecting the sky, epic, Game of Thrones cinematography, photoreal"
        motion: heavy rain pours down, the two knights raise their swords and step slowly toward each other, the soldiers in the ranks watch in silence, banners whip in the wind, the camera pushes slowly down the corridor between the ranks toward the knights
      - id: blows
        seconds: 6
        seed: 29
        strength: 0.75
        motion_seed: 3
        trim: 3.1
        prompt: "Cinematic medium-wide shot of a sword duel between two knights in full steel plate armour in heavy rain on a muddy field, the knight in a red surcoat on the left lifting his longsword high above his head about to strike, the knight in a blue surcoat on the right bracing with his sword raised to block, two paces apart, rain streaking down, mud on their greaves, ranks of soldiers blurred far behind them, dramatic cold backlight, photoreal"
        motion: from the very first moment the red knight brings his longsword crashing down in a powerful overhead strike, the blue knight blocks it with a shower of sparks, shoves him back and swings hard at his side, the red knight parries, they keep trading fast heavy blows, rain spraying off their armour and mud splashing under their boots, the camera tracks with them
      - id: feel
        seconds: 4
        seed: 9
        prompt: A dark cinema audience lit only by the flickering glow of the screen, rows of faces, a young woman in the centre with tears on her cheeks and a small smile, holding a plain red and white striped paper popcorn bucket with no logo and no text, cinematic, photoreal
        motion: the light from the screen flickers across the faces, she wipes a tear and laughs softly, the camera pushes in slowly toward her
      - id: missing
        seconds: 5
        prompt: A lone young man standing perfectly still on a crowded subway platform at night while commuters rush past him, he looks up at a huge glowing billboard of a vast turquoise ocean under a bright sky, cold fluorescent light, cinematic, photoreal
        motion: commuters stream past him in motion blur, he stays perfectly still looking up at the glowing ocean, the light of the billboard on his face, the camera pushes slowly toward him
      - id: screen
        seconds: 5
        seed: 17
        prompt: "A person seen from behind sitting at a wooden desk in a dark room at night, a laptop in front of them glowing with a vivid image of a tall wooden door standing open on a golden desert dune with a lush green valley visible through it, the warm light of the screen spilling onto their face, hands and the desk, everything else in darkness, cosy and cinematic, shallow depth of field, photoreal"
        motion: the camera slowly pulls back from the glowing laptop, revealing more of the dark room, the person's fingers scroll gently on the trackpad, the warm light of the screen flickers softly on their face
    steps:
      - kicker: Scroll Studio
        title: A landing page is the door <em>to a world.</em>
        intro: true
        state: { beat: door }
      - title: Not a page. <em>A story.</em>
        state: { beat: book }
      - title: One that makes you <em>laugh.</em>
        state: { beat: laugh }
      - title: One that makes it <em>hurt.</em>
        state: { beat: hurt }
      - title: One that makes you <em>love.</em>
        state: { beat: love }
      - title: One that makes you <em>hate.</em>
        state: { beat: standoff }
      - title: Everyone should <em>feel something.</em>
        state: { beat: feel }
      - title: Something missing <em>from their life.</em>
        state: { beat: missing }
      - title: That's what <em>Scroll Studio</em> does.
        state: { beat: screen }
  - type: cta
    kicker: Every frame above was made on one local GPU and built from one file
    title: See what it <em>can do.</em>
    button: { label: Open the showcase, href: ../showcase/dist/index.html }
footer: { left: "Scroll Studio · AGPL-3.0", right: "Made with Scroll Studio" }
